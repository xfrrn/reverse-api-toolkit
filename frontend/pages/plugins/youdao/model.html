<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模型翻译 - 帮大忙</title>
    <link rel="stylesheet" href="../../../assets/css/common.css" />
    <link rel="stylesheet" href="../../../assets/css/plugin-youdao.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="../../../assets/js/plugins/youdao/language-options.js" defer></script>
    <script src="../../../assets/js/plugins/youdao/model.js" defer></script>
  </head>
  <body class="model-page">
    <aside class="sidebar" aria-label="插件分类">
      <a class="brand" href="/"><div class="brand-mark" aria-hidden="true"></div><div><h1>帮大忙</h1><p>在线插件工具箱</p></div></a>
      <nav class="category-list">
        <a class="category" href="/"><i data-lucide="layout-grid"></i><span>全部</span></a>
        <a class="category is-active" href="/?category=文本工具"><i data-lucide="file-text"></i><span>文本工具</span></a>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar detail-topbar">
        <a class="secondary-button" href="/plugins/youdao"><i data-lucide="arrow-left"></i><span>返回有道翻译</span></a>
        <div class="top-actions">
          <a class="capability-link" href="/plugins/youdao/text">普通翻译</a>
          <a class="capability-link is-active" href="/plugins/youdao/model">模型翻译</a>
          <a class="capability-link" href="/plugins/youdao/languages">语言列表</a>
        </div>
      </header>

      <section class="hero-panel model-hero">
        <div class="hero-copy">
          <p>模型翻译</p>
          <h2>只保留 Lite 与 Pro，可用提示词控制译文</h2>
        </div>
        <div class="quick-stats"><div><strong>1000</strong><span>字符上限</span></div><div><strong>Lite</strong><span>快速模型</span></div><div><strong>Pro</strong><span>增强模型</span></div></div>
      </section>

      <section class="translator-shell model-shell">
        <div class="translator-header"><div><p>模型参数</p><h2>模型翻译工作台</h2></div></div>
        <div class="translator-grid">
          <div class="input-panel">
            <div class="field-row">
              <label>源语言<select id="sourceLang"><option value="auto">自动检测</option><option value="zh-CHS">中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option></select></label>
              <button class="swap-button" id="swapLang" type="button" title="交换语言"><i data-lucide="arrow-left-right"></i></button>
              <label>目标语言<select id="targetLang"><option value="zh-CHS">中文</option><option value="en" selected>英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option></select></label>
            </div>
            <div class="model-options always-visible">
              <label>模型<select id="modelName"><option value="lite">Lite</option><option value="pro">Pro</option></select></label>
              <label>提示词<input id="promptText" type="text" placeholder="例如：翻译得更自然、口语化" /></label>
            </div>
            <textarea id="sourceText" maxlength="1000" placeholder="输入要用模型翻译的内容">请把这句话翻译得自然一些。</textarea>
            <div class="submit-row"><span id="charCount">0 / 1000</span><button class="primary-button" id="translateButton" type="button"><i data-lucide="wand-sparkles"></i><span>模型翻译</span></button></div>
          </div>
          <div class="result-panel">
            <div class="result-title"><span>模型翻译结果</span><button class="icon-button small" id="copyResult" type="button" title="复制结果"><i data-lucide="copy"></i></button></div>
            <output id="resultOutput">点击模型翻译后，结果会显示在这里。</output>
            <p id="statusText" class="status-text"></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
