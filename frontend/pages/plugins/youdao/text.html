<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>普通翻译 - 帮大忙</title>
    <link rel="stylesheet" href="/static/assets/css/common.css" />
    <link rel="stylesheet" href="/static/assets/css/plugin-youdao.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="/static/assets/js/plugins/youdao/language-options.js" defer></script>
    <script src="/static/assets/js/plugins/youdao/text.js" defer></script>
  </head>
  <body class="text-page">
    <aside class="sidebar" aria-label="插件分类">
      <a class="brand" href="/"><div class="brand-mark" aria-hidden="true"></div><div><h1>帮大忙</h1><p>在线插件工具箱</p></div></a>
      <nav class="category-list">
        <a class="category" href="/"><i data-lucide="layout-grid"></i><span>全部</span></a>
        <a class="category is-active" href="/?category=文本工具"><i data-lucide="file-text"></i><span>文本工具</span></a>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar detail-topbar">
        <a class="secondary-button" href="/plugins/youdao"><i data-lucide="arrow-left"></i><span>返回有道翻译</span></a>
        <div class="top-actions">
          <a class="capability-link is-active" href="/plugins/youdao/text">普通翻译</a>
          <a class="capability-link" href="/plugins/youdao/model">模型翻译</a>
          <a class="capability-link" href="/plugins/youdao/languages">语言列表</a>
        </div>
      </header>

      <section class="hero-panel text-hero">
        <div class="hero-copy">
          <p>普通翻译</p>
          <h2>只处理文本直译，不混入模型参数</h2>
        </div>
        <div class="quick-stats"><div><strong>800</strong><span>字符上限</span></div><div><strong>中英</strong><span>默认语向</span></div><div><strong>REST</strong><span>普通接口</span></div></div>
      </section>

      <section class="translator-shell text-shell">
        <div class="translator-header"><div><p>输入文本</p><h2>普通翻译工作台</h2></div></div>
        <div class="translator-grid">
          <div class="input-panel">
            <div class="direction-row">
              <label>翻译方向<select id="directionSelect"></select></label>
            </div>
            <textarea id="sourceText" maxlength="800" placeholder="输入要翻译的内容">你好，欢迎使用帮大忙。</textarea>
            <div class="submit-row"><span id="charCount">0 / 800</span><button class="primary-button" id="translateButton" type="button"><i data-lucide="sparkles"></i><span>开始翻译</span></button></div>
          </div>
          <div class="result-panel">
            <div class="result-title"><span>普通翻译结果</span><button class="icon-button small" id="copyResult" type="button" title="复制结果"><i data-lucide="copy"></i></button></div>
            <output id="resultOutput">点击开始翻译后，结果会显示在这里。</output>
            <p id="statusText" class="status-text"></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
