<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开发工具 - 帮大忙</title>
    <link rel="stylesheet" href="../../assets/css/common.css" />
    <link rel="stylesheet" href="../../assets/css/plugin-devtools.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="../../assets/js/plugins/devtools-home.js" defer></script>
  </head>
  <body>
    <aside class="sidebar" aria-label="插件分类">
      <a class="brand" href="/">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>帮大忙</h1>
          <p>在线插件工具箱</p>
        </div>
      </a>
      <nav class="category-list">
        <a class="category" href="/"><i data-lucide="layout-grid"></i><span>全部</span></a>
        <a class="category is-active" href="/?category=开发工具"><i data-lucide="terminal-square"></i><span>开发工具</span></a>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar detail-topbar">
        <a class="secondary-button" href="/">
          <i data-lucide="arrow-left"></i>
          <span>返回插件中心</span>
        </a>
        <div class="top-actions">
          <button class="benefit-button" type="button">
            <i data-lucide="badge-check"></i>
            <span>开发工具 · 开发工具</span>
          </button>
          <button class="avatar" type="button" title="用户中心">
            <i data-lucide="user"></i>
          </button>
        </div>
      </header>

      <section class="hero-panel devtools-hero">
        <div class="hero-copy">
          <p>开发工具插件</p>
          <h2>面向开发者的调试与测试工具集合</h2>
        </div>
        <div class="quick-stats" aria-label="插件能力">
          <div><strong>API</strong><span>端点测试</span></div>
          <div><strong>本地</strong><span>数据不上传</span></div>
          <div><strong>多格式</strong><span>兼容 OpenAI/Claude</span></div>
        </div>
      </section>

      <section class="ability-panel">
        <div class="panel-title">
          <div>
            <p>能力入口</p>
            <h2>开发工具列表</h2>
          </div>
        </div>
        <div class="ability-grid single-ability">
          <a class="ability-card" href="/plugins/devtools/api-tester">
            <div class="tool-badge green"><span>测</span></div>
            <div>
              <h3>API 端点测试</h3>
              <p>输入 API URL 和 Key，一键检测可用性。兼容 OpenAI、Claude 及通用 REST 格式。</p>
            </div>
            <i data-lucide="chevron-right"></i>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
